const mk=(a,n)=>{const w=XLSX.utils.aoa_to_sheet(a);w['!cols']=[12,10,10,34,14,30,14,12,15,14,18].map(x=>({wch:x}));XLSX.utils.book_append_sheet(wb,w,n)};

const PL={TR:'trucks',TO:'tocos',LE:'leves',CT:'carretas'};
function overview(){
const br=today().split('-').reverse().join('/'),pc=(n,t)=>fmt(t?n/t*100:0);
const fl=t=>{const all=S.filter(v=>v.t===t),s=st(all),fn=NAME[t].toLowerCase(),ps=profs(t).map(c=>({c,l:all.filter(v=>(v.c||'')===c)})).filter(x=>x.l.length);
const bul=ps.map(x=>`<li><b>${x.l.length}</b> ${PL[x.c.slice(0,2)]||x.c||'sem perfil'}</li>`).join('');
const dn=ps.map(x=>({c:x.c,d:x.l.filter(v=>v.u)})).filter(x=>x.d.length);
const ind=dn.length?dn.map(x=>{const n=x.d.length;return`<li>Estamos com <b>${n}</b> ${n===1?'veículo indisponível':'veículos indisponíveis'} do perfil <b>${x.c||'sem perfil'}</b>${PERFIS[x.c]?' ('+PERFIS[x.c]+')':''}, isso representa um impacto de <b>${pc(n,s.t)}</b> ao quadro de carros ${t==='seco'?'secos':'frios'}.<div class="mut">Placas: ${x.d.map(v=>v.p).join(', ')}</div></li>`}).join('')+`<li>Total: <b>${s.u}</b> de ${s.t} indisponíveis (<b>${pc(s.u,s.t)}</b>) · disponibilidade de <b>${fmt(s.p)}</b></li>`:'<li>Nenhum veículo indisponível no momento ✅ (disponibilidade de 100%)</li>';
return`<div class="sec ${t}"><h2>${NAME[t]}</h2><p style="margin:0">Temos na ${fn} um total de <b>${s.t}</b> veículos.</p><ul>${bul}</ul><h3>Indisponibilidade da ${fn}:</h3><ul>${ind}</ul></div>`};
$('ovb').innerHTML=`<h1>📊 Visão Geral da Operação</h1><div class="mut dt">CD 409 · ${br}</div><div class="card main ovt">Temos na <b>FROTA TOTAL ${S.length}</b> veículos.</div>${fl('seco')}${fl('frio')}${att()}<div style="margin:10px 0"><button onclick="copyOv(this)">📋 Copiar resumo</button></div>`;
ov.showModal()}
function att(){const l=S.filter(v=>cur(v)!=null&&cur(v)>40).sort(cmp);
return`<div class="sec"><h2>⚠️ Atenção nos carros que estão próximos ao vencimento do checklist:</h2>${l.length?`<ul>${l.map(v=>{const n=cur(v),r=45-n;return`<li><b>${v.p}</b> · ${v.c||'sem perfil'}${PERFIS[v.c]?' ('+PERFIS[v.c]+')':''} · ${NAME[v.t]} · <b>${n} dias</b> · ${r<0?'VENCIDO há '+(-r)+' dia(s)':r===0?'VENCE HOJE':'vence em '+r+' dia(s)'}</li>`}).join('')}</ul>`:'<p>Nenhum veículo acima de 40 dias de checklist ✅</p>'}</div>`}
function ovText(){const o=[];$('ovb').querySelectorAll('h1,.dt,h2,h3,p,.ovt,li').forEach(e=>{const t=e.tagName;if(t==='LI'){const c=e.cloneNode(true),m=c.querySelector('.mut');if(m)m.remove();o.push('- '+c.textContent.trim());if(m)o.push('   '+m.textContent.trim())}else{if(t==='H2'||t==='H3')o.push('');o.push(e.textContent.trim())}});return o.join('\n').replace(/\n{3,}/g,'\n\n').trim()}
async function copyOv(b){const t=ovText();let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;ov.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(_){}a.remove()}
b.textContent=ok?'✅ Copiado!':'Não foi possível copiar';setTimeout(()=>b.textContent='📋 Copiar resumo',2200)}
function clearF(){F.p=F.t=F.s='';$('fp').value='';document.querySelectorAll('.fl select')[1].value='';render()}
function setU(p,u){const v=get(p);if(!v||v.u===u)return;wr(p,{u,r:'',d:u?today():''});render()}
function setD(p,x){wr(p,{d:x||today()});render()}
function setCk(p,x){wr(p,{ck:x===''?null:{n:Math.max(0,parseInt(x)||0),d:today()}});render()}
function zero(p){wr(p,{ck:{n:0,d:today()}});render()}
function msg(t,h){$('dt').textContent=t;$('db').innerHTML=h;$('da').innerHTML='<button onclick="dlg.close()">OK</button>';dlg.showModal()}
function add(t){const p=$('np_'+t).value.toUpperCase().replace(/[^A-Z0-9]/g,''),c=$('pf_'+t).value.toUpperCase().replace(/[^A-Z0-9]/g,''),tr=$('nt_'+t).value.trim();
if(p.length!==7)return msg('Placa inválida','Informe uma placa com 7 caracteres (ex.: ABC1D23).');
if(!/^(?=.*[A-Z])(?=.*\d)[A-Z0-9]{5,8}$/.test(c))return msg('Perfil inválido','O perfil precisa ter <b>letras e números</b>, no formato do perfil do veículo. Exemplo: <b>TR16BP3</b>.');
const e=get(p);if(e)return msg('⚠ Placa repetida',`A placa <b>${p}</b> já está cadastrada na <b>${NAME[e.t]}</b>.`);
const nv={p,t,c,tr,u:false,r:'',d:'',ck:null};S.push(nv);if(DB)DB.doc('veiculos/'+p).set(nv).catch(werr);else lsave();render()}
function askDel(p){$('dt').textContent='Remover '+p;$('db').innerHTML='Digite a senha para confirmar:<br><input id="pw" type="password" inputmode="numeric" style="margin-top:6px;width:100%"><div class="er" id="er"></div>';
$('da').innerHTML=`<button onclick="dlg.close()">Cancelar</button><button class="b no on" onclick="del('${p}')">Remover</button>`;dlg.showModal()}
function del(p){if($('pw').value!==PW){$('er').textContent='Senha incorreta.';return}S=S.filter(v=>v.p!==p);if(DB)DB.doc('veiculos/'+p).delete().catch(werr);else lsave();dlg.close();render()}
localMode();render();
(async()=>{try{const u=await claude.use('user');if(u&&u.can&&u.can('data.write')===false){document.body.classList.add('ro');$('ro').style.display='block'}}catch(e){}
try{DB=await claude.use('db')}catch(e){}
if(DB)DB.collection('veiculos').onSnapshot(sn=>{S=sn.docs.map(d=>Object.assign({u:false,r:'',d:'',ck:null},d.data()));rr()},e=>{DB=null;localMode();render()})})();
</script></body></html>
